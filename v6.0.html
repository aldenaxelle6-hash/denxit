<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OB54 UPDATED SENSI</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Courier New', Courier, monospace;
        }
        body {
            background-color: #050505;
            color: #00ff3c;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
            padding: 20px;
        }
        /* Matrix background styling */
        .glitch-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(rgba(0, 0, 0, 0.9), rgba(0, 0, 0, 0.95)), url('https://images.unsplash.com/photo-1526374965328-7f61d4dc18c5?q=80&w=1000') center/cover;
            opacity: 0.12;
            z-index: -2;
        }
        
        /* Particle Canvas */
        #particleCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            pointer-events: none; /* Supaya tidak mengganggu klik pada form */
        }

        .container {
            background: rgba(10, 10, 10, 0.93);
            border: 2px solid #00ff3c;
            box-shadow: 0 0 25px #00ff3c22;
            width: 100%;
            max-width: 430px;
            padding: 25px;
            border-radius: 12px;
            text-align: center;
            z-index: 1; /* Pastikan container di atas particle */
            position: relative;
        }
        h1 {
            font-size: 24px;
            margin-bottom: 2px;
            text-shadow: 0 0 12px #00ff3c;
            color: #fff;
            letter-spacing: 1px;
        }
        .DENN-tag {
            font-size: 16px;
            color: #00ff3c;
            font-weight: bold;
            letter-spacing: 3px;
            margin-bottom: 8px;
            text-shadow: 0 0 8px #00ff3c88;
        }
        .subtitle {
            font-size: 11px;
            color: #ff0055;
            margin-bottom: 25px;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: bold;
        }
        /* Login Form */
        #login-screen input {
            background: #111;
            border: 1px solid #00ff3c;
            color: #fff;
            padding: 14px;
            width: 100%;
            margin-bottom: 15px;
            text-align: center;
            font-size: 16px;
            border-radius: 6px;
            outline: none;
            letter-spacing: 3px;
        }
        #login-screen input:focus {
            box-shadow: 0 0 12px #00ff3c66;
        }
        /* Main Panel Screen */
        #panel-screen {
            display: none;
        }
        .stat-box {
            background: #0d0d0d;
            border: 1px dashed #ff0055;
            padding: 14px;
            margin-bottom: 20px;
            font-size: 13px;
            border-radius: 6px;
            text-align: left;
        }
        .stat-line {
            margin: 6px 0;
            display: flex;
            justify-content: space-between;
        }
        .stat-val {
            color: #fff;
            font-weight: bold;
        }
        /* Range Sliders */
        .slider-group {
            margin: 18px 0;
            text-align: left;
        }
        .slider-group label {
            font-size: 11px;
            display: block;
            margin-bottom: 6px;
            color: #aaa;
            letter-spacing: 0.5px;
        }
        .slider-container {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        input[type=range] {
            flex: 1;
            accent-color: #00ff3c;
            cursor: pointer;
            height: 6px;
        }
        .range-val {
            width: 45px;
            text-align: right;
            color: #00ff3c;
            font-size: 14px;
            font-weight: bold;
        }
        /* Dynamic Buttons */
        button {
            background: #00ff3c;
            color: #000;
            border: none;
            padding: 14px 20px;
            font-size: 15px;
            font-weight: bold;
            width: 100%;
            cursor: pointer;
            border-radius: 6px;
            transition: all 0.3s;
            text-transform: uppercase;
            box-shadow: 0 0 10px #00ff3c44;
        }
        button:hover {
            background: #fff;
            box-shadow: 0 0 15px #fff;
        }
        .inject-btn {
            background: #ff0055;
            color: #fff;
            margin-top: 15px;
            box-shadow: 0 0 10px #ff005544;
            letter-spacing: 1px;
        }
        .inject-btn:hover {
            background: #ff2266;
            box-shadow: 0 0 15px #ff0055;
        }
        .error-msg {
            color: #ff0055;
            font-size: 12px;
            margin-top: -10px;
            margin-bottom: 12px;
            display: none;
            font-weight: bold;
        }
        .loading {
            color: #ff0055;
            font-style: italic;
            animation: blink 0.8s infinite;
        }
        @keyframes blink {
            0% { opacity: 0.4; }
            50% { opacity: 1; }
            100% { opacity: 0.4; }
        }
    </style>
</head>
<body>

    <div class="glitch-bg"></div>
    <canvas id="particleCanvas"></canvas>

    <div class="container">
        <h1>OB54 UPDATED SENSI</h1>
        <div class="DENN-tag">DENN SENSI</div>
        <div class="subtitle">VIP REGEDIT INJECTOR v5.0</div>

        <div id="login-screen">
            <p style="margin-bottom: 15px; font-size: 12px; color: #888; letter-spacing: 1px;">BYPASS ENCRYPTION KEY REQUIRED</p>
            <input type="password" id="password-input" placeholder="••••">
            <div class="error-msg" id="error-txt">‼️ ACCESS DENIED: INVALID KEY ‼️</div>
            <button onclick="checkPassword()">INITIALIZE BYPASS</button>
        </div>

        <div id="panel-screen">
            <div class="stat-box">
                <div style="color: #ff0055; font-weight: bold; margin-bottom: 8px; border-bottom: 1px dashed #ff005544; padding-bottom: 4px;">[+] HIGH PERFORMANCE DETECTION</div>
                <div class="stat-line"><span>> PET SENSITIVITY:</span> <span class="stat-val" id="phone-sensi">CONFIGURING...</span></div>
                <div class="stat-line"><span>> GENERATED DPI:</span> <span class="stat-val" id="dpi-val">MATCHING...</span></div>
                <div class="stat-line"><span>> BYPASS LAYER:</span> <span class="stat-val" style="color: #00ff3c;">ANTI-BAN ACTIVE</span></div>
            </div>

            <div class="slider-group">
                <label>AUTO HEADSHOT RATE (PERCENTAGE)</label>
                <div class="slider-container">
                    <input type="range" min="1" max="25" value="25" oninput="updateVal(this, 'val1', '%')">
                    <span class="range-val" id="val1">25%</span>
                </div>
            </div>

            <div class="slider-group">
                <label>REGEDIT DPI CALIBRATION</label>
                <div class="slider-container">
                    <input type="range" min="100" max="900" value="720" oninput="updateVal(this, 'val2', '')">
                    <span class="range-val" id="val2">720</span>
                </div>
            </div>

            <div class="slider-group">
                <label>AIM LOCK / FOV SMOOTHING</label>
                <div class="slider-container">
                    <input type="range" min="0" max="30" value="30" oninput="updateVal(this, 'val3', '%')">
                    <span class="range-val" id="val3">30%</span>
                </div>
            </div>

            <button class="inject-btn" onclick="startInjection()">[!] INJECT TO FREE FIRE</button>
            <p id="inject-status" style="margin-top: 12px; font-size: 13px; color: #888; display: none;"></p>
        </div>
    </div>

    <script>
        // ==========================================
        // PARTICLE BACKGROUND SYSTEM
        // ==========================================
        const canvas = document.getElementById("particleCanvas");
        const ctx = canvas.getContext("2d");
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        let particlesArray = [];

        class Particle {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 2 + 1;
                this.speedX = (Math.random() * 1.5) - 0.75;
                this.speedY = (Math.random() * 1.5) - 0.75;
            }
            update() {
                this.x += this.speedX;
                this.y += this.speedY;
                
                // Pantulkan dari tepi layar
                if (this.x > canvas.width || this.x < 0) this.speedX = -this.speedX;
                if (this.y > canvas.height || this.y < 0) this.speedY = -this.speedY;
            }
            draw() {
                ctx.fillStyle = 'rgba(0, 255, 60, 0.8)'; // Warna hijau hacker
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function initParticles() {
            particlesArray = [];
            // Hitung jumlah partikel berdasarkan ukuran layar
            let numberOfParticles = (canvas.width * canvas.height) / 9000; 
            for (let i = 0; i < numberOfParticles; i++) {
                particlesArray.push(new Particle());
            }
        }

        function animateParticles() {
            requestAnimationFrame(animateParticles);
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            for (let i = 0; i < particlesArray.length; i++) {
                particlesArray[i].update();
                particlesArray[i].draw();
                
                // Buat garis koneksi antar partikel
                for (let j = i; j < particlesArray.length; j++) {
                    let dx = particlesArray[i].x - particlesArray[j].x;
                    let dy = particlesArray[i].y - particlesArray[j].y;
                    let distance = Math.sqrt(dx * dx + dy * dy);
                    
                    if (distance < 100) {
                        ctx.beginPath();
                        ctx.strokeStyle = 'rgba(0, 255, 60, ' + (1 - distance/100) + ')';
                        ctx.lineWidth = 0.8;
                        ctx.moveTo(particlesArray[i].x, particlesArray[i].y);
                        ctx.lineTo(particlesArray[j].x, particlesArray[j].y);
                        ctx.stroke();
                    }
                }
            }
        }

        // Handle resize window
        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            initParticles();
        });

        initParticles();
        animateParticles();

        // ==========================================
        // UI LOGIC SYSTEM
        // ==========================================
        
        // পাসওয়ার্ড চেক করার লজিক (1234)
        function checkPassword() {
            const pass = document.getElementById('password-input').value;
            if(pass === "1234") {
                document.getElementById('login-screen').style.display = 'none';
                document.getElementById('panel-screen').style.display = 'block';
                generateDynamicConfig();
            } else {
                const err = document.getElementById('error-txt');
                err.style.display = 'block';
                setTimeout(() => { err.style.display = 'none'; }, 2500);
            }
        }

        // প্রতিবার ঢোকার সময় অটোমেটিক ১২ো থেকে ২০০ এর মধ্যে হাই সেন্সিটিভিটি জেনারেট করার লজিক
        function generateDynamicConfig() {
            // র্যান্ডম পেট সেন্সি (১২০ থেকে ২০০ এর মধ্যে যেকোনো সংখ্যা)
            const randomSensi = (Math.random() * (200.0 - 120.0) + 120.0).toFixed(1);
            // র্যান্ডম DPI (যেমন: 680 থেকে 960)
            const randomDPI = Math.floor(Math.random() * (960 - 680 + 1)) + 680 + " DPI";

            document.getElementById('phone-sensi').innerText = randomSensi;
            document.getElementById('dpi-val').innerText = randomDPI;
        }

        // স্লাইডার কমানো/বাড়ানোর কন্ট্রোল
        function updateVal(slider, id, unit) {
            document.getElementById(id).innerText = slider.value + unit;
        }

        // ইনজেকশন স্ক্রিপ্ট রান করে অটোমেটিক ফ্রি ফায়ার গেম ওপেন করার কোড
        function startInjection() {
            const status = document.getElementById('inject-status');
            status.style.display = 'block';
            status.innerHTML = '<span class="loading">Bypassing security layers & compiling registry...</span>';
            
            setTimeout(() => {
                status.innerHTML = '<span style="color: #00ff3c;">INJECTION COMPLETE! LAUNCHING GAME...</span>';
                
                setTimeout(() => {
                    // অ্যান্ড্রোয়েড ফোনে সরাসরি ফ্রি ফায়ার বা ম্যাক্স অ্যাপ ওপেন করার ডিপলিংক
                    window.location.href = "intent://launch/#Intent;scheme=android-app;package=com.dts.freefireth;end";
                    
                    setTimeout(() => {
                        window.location.href = "intent://launch/#Intent;scheme=android-app;package=com.dts.freefiremax;end";
                    }, 500);
                }, 1500);
            }, 3000);
        }
    </script>
</body>
</html>
