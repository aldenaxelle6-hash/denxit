pid_t FindPid(const std::string& package) {
    DIR* dir = opendir("/proc");
    if (!dir) return -1;
    struct dirent* entry;
    while ((entry = readdir(dir)) != nullptr) {
        if (entry->d_type != DT_DIR) continue;
        std::string pid_str = entry->d_name;
        if (!std::all_of(pid_str.begin(), pid_str.end(), ::isdigit)) continue;
        std::string cmdline_path = "/proc/" + pid_str + "/cmdline";
        std::ifstream cmdline(cmdline_path);
        std::string cmd;
        if (getline(cmdline, cmd, '\0')) {
            if (cmd.find(package) != std::string::npos) {
                closedir(dir);
                return std::stoi(pid_str);
            }
        }
    }
    closedir(dir);
    return -1;
}

bool ReadMemory(pid_t pid, uintptr_t address, void* buffer, size_t size) {
    if (ptrace(PTRACE_ATTACH, pid, nullptr, nullptr) == -1) return false;
    waitpid(pid, nullptr, 0);
    uint8_t* buf = (uint8_t*)buffer;
    for (size_t i = 0; i < size; i += sizeof(long)) {
        long word = ptrace(PTRACE_PEEKDATA, pid, address + i, nullptr);
        if (word == -1 && errno) {
            ptrace(PTRACE_DETACH, pid, nullptr, nullptr);
            return false;
        }
        memcpy(buf + i, &word, sizeof(long));
    }
    ptrace(PTRACE_DETACH, pid, nullptr, nullptr);
    return true;
}

// ============================================================
// touch_crash.cpp – Генератор сверхбыстрых касаний (Windows)
// ============================================================
#define WIN32_LEAN_AND_MEAN
#include <windows.h>
#include <winuser.h>
#include <iostream>
#include <thread>
#include <chrono>
#include <vector>
#include <random>

typedef BOOL (WINAPI *InjectTouchInputFunc)(UINT32, const POINTER_TOUCH_INFO*);
InjectTouchInputFunc pInjectTouchInput = nullptr;

bool InitTouchInjection() {
    HMODULE hUser32 = GetModuleHandleW(L"user32.dll");
    if (!hUser32) return false;
    pInjectTouchInput = (InjectTouchInputFunc)GetProcAddress(hUser32, "InjectTouchInput");
    return (pInjectTouchInput != nullptr);
}

POINTER_TOUCH_INFO MakeTouchInfo(UINT32 contactId, int x, int y, bool down) {
    POINTER_TOUCH_INFO info = {};
    info.pointerInfo.pointerType = PT_TOUCH;
    info.pointerInfo.pointerId = contactId;
    info.pointerInfo.ptPixelLocation.x = x;
    info.pointerInfo.ptPixelLocation.y = y;
    info.touchMasks = TOUCH_MASK_CONTACTAREA | TOUCH_MASK_ORIENTATION | TOUCH_MASK_PRESSURE;
    info.rcContact.left = x - 5;
    info.rcContact.top = y - 5;
    info.rcContact.right = x + 5;
    info.rcContact.bottom = y + 5;
    info.orientation = 0;
    info.pressure = 32000;
    info.pointerInfo.pointerFlags = down ? (POINTER_FLAG_DOWN | POINTER_FLAG_INRANGE) : (POINTER_FLAG_UP | POINTER_FLAG_INRANGE);
    return info;
}

void StressTouchScreen() {
    const int NUM_CONTACTS = 20;
    const int DELAY_MS = 10;
    std::random_device rd;
    std::mt19937 gen(rd());
    std::uniform_int_distribution<> xDist(100, 1900);
    std::uniform_int_distribution<> yDist(100, 1000);
    std::uniform_int_distribution<> contactDist(1000, 9999);
    std::vector<POINTER_TOUCH_INFO> touches(NUM_CONTACTS);
    std::vector<UINT32> contactIds;
    for (int i = 0; i < NUM_CONTACTS; ++i) contactIds.push_back(contactDist(gen));
    bool isDown = true;
    int counter = 0;
    while (true) {
        for (int i = 0; i < NUM_CONTACTS; ++i) {
            int x = xDist(gen), y = yDist(gen);
            touches[i] = MakeTouchInfo(contactIds[i], x, y, isDown);
            if (!isDown) touches[i].pointerInfo.pointerFlags = POINTER_FLAG_UP | POINTER_FLAG_INRANGE;
            else if (counter > 0) touches[i].pointerInfo.pointerFlags = POINTER_FLAG_UPDATE | POINTER_FLAG_INRANGE;
        }
        if (pInjectTouchInput) pInjectTouchInput(NUM_CONTACTS, touches.data());

          this.r = type === 'bg' ? Math.random()*2.5+0.8 : Math.random()*2+0.5;

        update() {

          if (this.y < -20) this.y = H+20;
          if (this.y > H+20) this.y = -20;
        }
        draw() {
          const ctx = this.ctx;
